<div class="site-header__inner container">
    <a href="/" class="brand">
        {{ $logo := (resources.Get "images/logo.svg") }}
        <span
            class="brand__logo"
            style="--logo: url('{{ $logo.RelPermalink }}')"
            aria-hidden="true"
        ></span>
        {{ .Site.Title }}
    </a>
    <nav class="nav">
        <ul class="nav__list">
            {{ partial "menu.html" (dict "menuID" "main" "page" .) }}
        </ul>
        <span class="nav__separator" aria-hidden="true"></span>
        {{ partial "theme-toggle.html" . }}
    </nav>
</div>
