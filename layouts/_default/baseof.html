<!doctype html>
<html
    lang="{{ site.Language.LanguageCode }}"
    dir="{{ or site.Language.LanguageDirection `ltr` }}"
>
    <head>
        {{ partial "head.html" . }}
    </head>
    {{ $paper := (resources.Get "images/paper.svg") }}
    <body
        class="container min-h-screen max-w-5xl mx-auto p-2 *:p-2 bg-stone-100 bg-repeat text-stone-900"
        style="background-image: url({{ $paper.RelPermalink }});"
    >
        <header
            class="sticky top-2 z-10 h-12 bg-stone-100/60 backdrop-blur-sm backdrop-brightness-105 inset-ring inset-ring-current/30 rounded-xl"
        >
            {{ partial "header.html" . }}
        </header>
        <main
            class="mx-4 **:target:scroll-mt-16 [&_a]:text-orange-700 [&_a]:font-medium [&_a]:hover:bg-current/20 [&_a]:focus:bg-current/20"
        >
            {{ block "main" . }}{{ end }}
        </main>
        <footer class="sticky top-full my-8">
            {{ partial "footer.html" . }}
        </footer>
    </body>
</html>
