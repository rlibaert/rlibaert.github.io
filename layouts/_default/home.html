{{ define "main" }}
<section class="intro">
    <h1 class="page-title">{{ .Title }}</h1>
    <div class="prose">{{ .Content }}</div>
    <div class="intro__actions">
        <a href="/resume" class="button button--primary">Resume</a>
        <a href="https://github.com/rlibaert" class="button">GitHub</a>
        <a href="mailto:blog@rlibaert.dev" class="button">Contact</a>
    </div>
</section>
{{ with where site.RegularPages "Section" "posts" }}
<section class="recent">
    <div class="recent__header">
        <h2 class="section-label">Recent posts</h2>
        <a href="/posts" class="recent__all">All posts →</a>
    </div>
    <div class="post-list">
        {{ range first 5 . }}{{ partial "post-item.html" . }}{{ end }}
    </div>
</section>
{{ end }}
{{ end }}
